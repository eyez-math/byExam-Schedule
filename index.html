<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח מבחנים · מחצית א׳ תשפ״ז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F5; --surface:#FFFFFF; --ink:#16233A; --muted:#5B6B82; --line:#D3DCE6;
  --accent:#1D5FD1; --accent-ink:#FFFFFF; --today:#FFE58A; --chip:#F3F6FA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1724; --surface:#18233A; --ink:#E6EDF7; --muted:#9AAAC2; --line:#2B3A55;
  --accent:#6EA2FF; --accent-ink:#0F1724; --today:#5A4A10; --chip:#1F2C46; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0F1724; --surface:#18233A; --ink:#E6EDF7; --muted:#9AAAC2; --line:#2B3A55;
  --accent:#6EA2FF; --accent-ink:#0F1724; --today:#5A4A10; --chip:#1F2C46; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;min-width:230px}
.next .lbl{font-size:.85rem;opacity:.75}
.next .big{font-size:1.25rem;font-weight:700}
.next .days{font-size:2rem;font-weight:800;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
.rowlbl{font-weight:700;font-size:.9rem;color:var(--muted);min-width:56px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.badge{font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;background:#FDE68A;color:#78350F}
.badge.bag{background:#B91C1C;color:#fff}
.sel{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px;font-size:1rem;min-width:220px;max-width:100%;cursor:pointer}
.src{font-size:.8rem;color:var(--muted);margin-top:30px;text-align:center}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.subj[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.subj[aria-pressed="true"] .dot{background:#fff}
.search{flex:1 1 200px;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 12px;min-width:0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
.tabs{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 12px}
.count{color:var(--muted);font-size:.92rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.9rem}
/* list */
.week{margin-bottom:22px}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px}
.weekhead h2{font-size:1.05rem;margin:0}
.weekhead .n{color:var(--muted);font-size:.88rem}
.weekhead .n.busy{color:#C2410C;font-weight:700}
.day{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dnum{text-align:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 0;align-self:start}
.dnum b{display:block;font-size:1.5rem;line-height:1}
.dnum span{font-size:.78rem;color:var(--muted)}
.day.today .dnum{background:var(--today)}
.day.past{opacity:.5}
.exams{display:flex;flex-direction:column;gap:6px}
.ex{cursor:default;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:10px;padding:8px 12px;text-align:start;width:100%}
.ex:has(.more){cursor:pointer}
.ex .t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.ex .s{font-weight:700;font-size:1.05rem}
.ex .p{font-size:.88rem;color:var(--muted)}
.ex .cls{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ex .cls i{font-style:normal;font-size:.8rem;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ex .cls i.me{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex .more{display:none;margin-top:6px;font-size:.88rem;color:var(--muted)}
.ex[aria-expanded="true"] .more{display:block}
.more ul{margin:4px 0 0;padding-inline-start:18px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead h2{margin:0;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600;padding:2px 0}
.cell{min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.out{opacity:.35}
.cell.today{box-shadow:inset 0 0 0 2px #E0A800;background:var(--today)}
.cell.sel{outline:3px solid var(--accent)}
.cell .n{font-weight:700;font-size:.9rem}
.pill{background:var(--c);color:#fff;border-radius:6px;font-size:.74rem;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmore{font-size:.72rem;color:var(--muted)}
.dots{display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.sat{background:var(--chip)}
.detail{margin-top:14px}
.detail h3{margin:0 0 8px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media (max-width:640px){
  .cell{min-height:58px}
  .pill{font-size:0;height:8px;width:8px;padding:0;border-radius:50%;display:inline-block}
  .dots{flex-direction:row;flex-wrap:wrap}
  .pmore{display:none}
  .next{width:100%}
  #subjChips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;flex:1;min-width:0}
  .chip{white-space:nowrap;flex:none}
}
@media print{.panel,.tabs,.btn,.next{display:none!important} body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>לוח מבחנים</h1>
      <p class="sub">מחצית א׳ תשפ״ז · דרכא בית ירח</p>
    </div>
    <div class="next" id="next" aria-live="polite"></div>
  </header>

  <section class="panel" aria-label="סינון">
    <div class="row"><label class="rowlbl" for="clsSel">כיתה</label>
      <select id="clsSel" class="sel"></select></div>
    <div class="row"><label class="rowlbl" for="subjSel">מקצוע</label>
      <select id="subjSel" class="sel"></select></div>
    <div class="row">
      <span class="rowlbl">חיפוש</span>
      <input class="search" id="q" type="search" placeholder="שם מבחן, למשל מתכונת או בגרות…">
      <label class="toggle"><input type="checkbox" id="future" checked> רק מבחנים שעוד לא היו</label>
    </div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabList" aria-selected="true">רשימה</button>
      <button role="tab" id="tabCal" aria-selected="false">לוח שנה</button>
    </div>
    <span class="count" id="count"></span>
    <span class="row" style="margin:0">
      <button class="btn" id="share">העתקת קישור לסינון</button>
      <button class="btn" onclick="window.print()">הדפסה</button>
    </span>
  </div>

  <main id="view"><div class="empty">טוען את לוח המבחנים…</div></main>
  <p class="src" id="src"></p>
</div>

const fixKeyboard = s => s.replace(/[a-z][a-z,.;]*/gi, w => [...w.toLowerCase()].map(c=>KB[c]||c).join('')).replace(/מתכונ(?!ת)/g,'מתכונת');
function normTitle(s){
  s=fixKeyboard(s.replace(/\s+/g,' ').trim()).replace(/\s+/g,' ').trim().replace(/פיסיקה/g,'פיזיקה').replace(/תנך/g,'תנ"ך');
  const fix={'רצועה 2':'מבחן רצועה 2','מבחן הבעה':'הבעה עברית','מבחן הבעה עברית':'הבעה עברית','מבחן בתנ"ך':'תנ"ך'};
  s=fix[s]||s;
  return s.replace(/^(?:מבחן\s+)?רצועה\s*(\d)(?:\s+מבחן)?$/,'מבחן רצועה $1');
}
function baseOf(title){
  const m=title.match(/רצועה\s*(\d)/); if(m) return 'רצועה '+m[1];
  return BASES.find(b=>title.includes(b)) || title;
}
function typeOf(title){
  for(const k of ['בגרות','מתכונת','מסכם','שכבתי','בקיאות','בע"פ']) if(title.includes(k)) return k;
  return '';
}
function toISO(v){
  v=String(v).trim(); let m;
  if(m=v.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/)) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return null;
}
/* תומך בשני הפורמטים של הייצוא: המלא (משעה, עד שעה, ק. לימוד) והמצומצם (כיתה בלבד).
   העמודות מזוהות לפי שורת הכותרת "תאריך | יום | שם מבחן | ..." של כל כיתה. */
const DEFAULT_COLS={date:0,title:2,from:3,to:4,note:5,course:6};
function parseRows(rows){
  const groups=new Map(); let cls=null, cols=DEFAULT_COLS;
  for(const r of rows){
    const a=(r[0]||'').trim();
    const m=a.match(/מבחנים לכיתה\s*(?:\([^)]*\)\s*)?(.+?)\s+לתקופה/);
    if(m){cls=m[1].trim().replace(/(\d)\s*חנם/,'$1 חנם');continue;}
    if(a==='תאריך'){
      const idx=name=>r.findIndex(x=>(x||'').trim()===name);
      cols={date:0,title:idx('שם מבחן'),from:idx('משעה'),to:idx('עד שעה'),note:idx('הערה'),course:idx('ק. לימוד')};
      if(cols.title<0) cols.title=2;
      continue;
    }
    const d=toISO(a); if(!d||!cls) continue;
    const title=normTitle(r[cols.title]||''); if(!title) continue;
    const get=i=>i>=0?(r[i]||'').toString().trim():'';
    const f=parseInt(get(cols.from)), to=parseInt(get(cols.to));
    const h=f?[f,to||f]:null;
    const course=get(cols.course).replace(/\s+/g,' ');
    const i=course.indexOf(','); const teacher=(i<0?course:course.slice(0,i)).trim();
    const csub=i<0?'':course.slice(i+1).trim().replace(/\s+[א-ת]{1,2}\d+( חנם)?(,.*)?$/,'').trim();
    const k=[cls,d,title,h?h.join('-'):''].join('|');
    if(!groups.has(k)) groups.set(k,{c:cls,d,title,s:baseOf(title),type:typeOf(title),h,t:[],n:get(cols.note)});
    const g=groups.get(k);
    if(teacher && !g.t.some(x=>x[0]===teacher&&x[1]===csub)) g.t.push([teacher,csub]);
  }
  return [...groups.values()];
}
function parseCSV(text){
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'){row.push(f);out.push(row);row=[];f=''}
    else if(c!='\r') f+=c;
  }
  if(f||row.length){row.push(f);out.push(row)}
  return out;
}

let RAW=[],EXAMS=[],ALLCLS=[],ALLSUBJ=[];
function build(raw){
  RAW=raw;
  const map=new Map();
  for(const r of RAW){
    const k=[r.d,r.title,r.h?r.h.join('-'):''].join('|');
    if(!map.has(k)) map.set(k,{d:r.d,s:r.s,title:r.title,type:r.type,h:r.h,classes:[],t:[],n:r.n});
    const e=map.get(k); if(!e.classes.includes(r.c)) e.classes.push(r.c);
    for(const t of r.t) if(!e.t.some(x=>x[0]===t[0]&&x[1]===t[1])) e.t.push(t);
  }
  EXAMS=[...map.values()].sort((a,b)=>a.d.localeCompare(b.d)||(a.h?a.h[0]:0)-(b.h?b.h[0]:0)||a.title.localeCompare(b.title,'he'));
  EXAMS.forEach(e=>sortCls(e.classes));
  ALLCLS=sortCls([...new Set(RAW.map(r=>r.c))]);
  const cnt={};RAW.forEach(r=>cnt[r.s]=(cnt[r.s]||0)+1);
  ALLSUBJ=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
}

/* ---------- מצב ---------- */
const st={grade:null,cls:null,subj:new Set(),q:'',future:true,view:'list',month:null,sel:null};

function filtered(ignoreFuture){
  const q=st.q.trim();
  return EXAMS.filter(e=>
    (!st.cls||e.classes.includes(st.cls)) &&
    (st.cls||!st.grade||e.classes.some(c=>gradeOf(c)===st.grade)) &&
    (!st.subj.size||st.subj.has(e.s)) &&
    (ignoreFuture||!st.future||e.d>=TODAY) &&
    (!q||e.title.includes(q)||e.t.some(t=>t[0].includes(q)||t[1].includes(q))));
}

function chips(){
  const sel=document.getElementById('clsSel');
  const grades=GRADES.filter(g=>ALLCLS.some(c=>gradeOf(c)===g));
  sel.innerHTML=`<option value="">כל השכבות</option>`+grades.map(g=>`<optgroup label="שכבה ${g}׳"><option value="g:${g}">כל שכבה ${g}׳</option>`+
    ALLCLS.filter(c=>gradeOf(c)===g).map(c=>`<option value="c:${esc(c)}">${esc(c)}</option>`).join('')+`</optgroup>`).join('');
  sel.value=st.cls?'c:'+st.cls:st.grade?'g:'+st.grade:'';
  const ss=document.getElementById('subjSel');
  ss.innerHTML=`<option value="">כל המקצועות</option>`+[...ALLSUBJ].sort((a,b)=>a.localeCompare(b,'he')).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  ss.value=st.subj.size?[...st.subj][0]:'';
}

function examCard(e){
  let cls=e.classes;
  if(st.grade&&!st.cls) cls=cls.filter(c=>gradeOf(c)===st.grade);
  const t=e.t.map(([n,c])=>`<li>${esc(n)}${c&&!e.title.includes(c)?` · ${esc(c)}`:''}</li>`).join('');
  const badge=e.type==='בגרות'?'<span class="badge bag">בגרות</span>':e.type?`<span class="badge">${esc(e.type)}</span>`:'';
  return `<button class="ex" style="--c:${col(e.s)}" aria-expanded="false">
    <div class="t"><span class="s">${esc(e.title)}</span>${badge}${e.h?`<span class="p">${period(e.h)}</span>`:''}${e.n?`<span class="p">${esc(e.n)}</span>`:''}</div>
    <div class="cls">${cls.map(c=>`<i class="${c===st.cls?'me':''}">${esc(c)}</i>`).join('')}</div>
    ${e.t.length?`<div class="more">מורים (${e.t.length}):<ul>${t}</ul></div>`:''}
  </button>`;
}

function renderList(list){
  if(!list.length) return `<div class="empty">אין מבחנים שמתאימים לסינון. אפשר לנקות מקצועות או לבטל את "רק מבחנים שעוד לא היו".</div>`;
  const weeks=new Map();
  for(const e of list){const d=parseD(e.d);const s=new Date(d);s.setDate(d.getDate()-d.getDay());const k=fmtD(s);
    if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(e);}
  let html='';
  for(const [ws,arr] of weeks){
    const s=parseD(ws),en=new Date(s);en.setDate(s.getDate()+5);
    const title=s.getMonth()===en.getMonth()?`${s.getDate()}-${en.getDate()} ב${MONTHS[s.getMonth()]}`:`${s.getDate()} ב${MONTHS[s.getMonth()]} – ${en.getDate()} ב${MONTHS[en.getMonth()]}`;
    const busy=st.cls&&arr.length>=3;
    html+=`<section class="week"><div class="weekhead"><h2>שבוע ${title}</h2><span class="n ${busy?'busy':''}">${arr.length} מבחנים${busy?' · שבוע עמוס':''}</span></div>`;
    const days=new Map();arr.forEach(e=>{if(!days.has(e.d))days.set(e.d,[]);days.get(e.d).push(e)});
    for(const [d,ex] of days){const dd=parseD(d);
      html+=`<div class="day ${d===TODAY?'today':''} ${d<TODAY?'past':''}"><div class="dnum"><span>יום ${DAYS[dd.getDay()]}</span><b>${dd.getDate()}</b><span>${MONTHS[dd.getMonth()]}</span></div><div class="exams">${ex.map(examCard).join('')}</div></div>`;}
    html+='</section>';
  }
  return html;
}

function renderCal(list){
  const byDay=new Map();list.forEach(e=>{if(!byDay.has(e.d))byDay.set(e.d,[]);byDay.get(e.d).push(e)});
  if(!st.month){const first=(list.find(e=>e.d>=TODAY)||list[0]||{d:TODAY}).d;st.month=first.slice(0,7);}
  const [y,m]=st.month.split('-').map(Number);
  const first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=fmtD(d);
    if(i===35&&d.getMonth()!==m-1)break;
    const ex=byDay.get(k)||[];
    cells+=`<button class="cell ${d.getMonth()!==m-1?'out':''} ${k===TODAY?'today':''} ${k===st.sel?'sel':''} ${d.getDay()===6?'sat':''}" data-d="${k}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}, ${ex.length} מבחנים">
      <span class="n">${d.getDate()}</span><span class="dots">${ex.slice(0,3).map(e=>`<span class="pill" style="--c:${col(e.s)}">${esc(e.title)}</span>`).join('')}</span>${ex.length>3?`<span class="pmore">+${ex.length-3}</span>`:''}</button>`;}
  const selEx=st.sel?byDay.get(st.sel)||[]:[];
  const sd=st.sel?parseD(st.sel):null;
  return `<div class="panel"><div class="calhead"><button class="btn" data-mv="-1" aria-label="חודש קודם">הקודם</button><h2>${MONTHS[m-1]} ${y}</h2><button class="btn" data-mv="1" aria-label="חודש הבא">הבא</button></div>
   <div class="grid">${DAYS.map(d=>`<div class="wd">${d}</div>`).join('')}${cells}</div></div>
   <div class="detail">${st.sel?`<h3>יום ${DAYS[sd.getDay()]}, ${sd.getDate()} ב${MONTHS[sd.getMonth()]}</h3>${selEx.length?`<div class="exams">${selEx.map(examCard).join('')}</div>`:'<p class="count">אין מבחנים ביום הזה.</p>'}`:'<p class="count">לחיצה על יום מציגה את פרטי המבחנים.</p>'}</div>`;
}

function scopeName(){return st.cls?'לכיתה '+st.cls:st.grade?'לשכבה '+st.grade+'׳':''}
function renderNext(){
  const up=filtered(true).filter(e=>e.d>=TODAY);
  const el=document.getElementById('next');
  if(!up.length){el.innerHTML=`<div class="lbl">${esc(scopeName()||'כל השכבות')}</div><div class="big">אין מבחנים קרובים</div>`;return}
  const e=up[0],diff=Math.round((parseD(e.d)-parseD(TODAY))/864e5);
  el.innerHTML=`<div class="lbl">המבחן הבא ${esc(scopeName())}</div>
   <div class="big">${esc(e.title)}</div><div><span class="days">${diff===0?'היום':diff===1?'מחר':diff}</span>${diff>1?' ימים':''} · ${parseD(e.d).getDate()} ב${MONTHS[parseD(e.d).getMonth()]}</div>`;
}

function render(){
  chips(); renderNext();
  const list=st.view==='cal'?filtered(true):filtered();
  document.getElementById('count').textContent=`${list.length} מבחנים ${scopeName()}`;
  document.getElementById('view').innerHTML= st.view==='cal'?renderCal(list):renderList(list);
  document.getElementById('tabList').setAttribute('aria-selected',st.view==='list');
  document.getElementById('tabCal').setAttribute('aria-selected',st.view==='cal');
  document.getElementById('future').closest('label').style.display=st.view==='cal'?'none':'';
  const h=new URLSearchParams();if(st.grade)h.set('g',st.grade);if(st.cls)h.set('c',st.cls);if(st.subj.size)h.set('s',[...st.subj].join(','));if(st.view==='cal')h.set('v','cal');
  try{history.replaceState(null,'',h.toString()?'#'+h.toString():location.pathname+location.search)}catch(e){}
  try{localStorage.setItem('exam-filter',JSON.stringify({g:st.grade,c:st.cls}))}catch(e){}
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.s!==undefined){const s=b.dataset.s;if(!s)st.subj.clear();else st.subj.has(s)?st.subj.delete(s):st.subj.add(s);render();}
  else if(b.classList.contains('ex')&&b.querySelector('.more')){b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')!=='true');}
  else if(b.dataset.mv){const [y,m]=st.month.split('-').map(Number);const d=new Date(y,m-1+Number(b.dataset.mv),1);st.month=fmtD(d).slice(0,7);st.sel=null;render();}
  else if(b.dataset.d){st.sel=b.dataset.d;render();document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'nearest'});}
  else if(b.id==='tabList'){st.view='list';render()}
  else if(b.id==='tabCal'){st.view='cal';render()}
  else if(b.id==='share'){const u=location.href;
    const done=()=>{b.textContent='הקישור הועתק';setTimeout(()=>b.textContent='העתקת קישור לסינון',1800)};
    try{navigator.clipboard.writeText(u).then(done,()=>prompt('העתיקו את הקישור:',u))}catch(e){prompt('העתיקו את הקישור:',u)}}
});
document.getElementById('clsSel').addEventListener('change',e=>{const v=e.target.value;
  st.cls=v.startsWith('c:')?v.slice(2):null; st.grade=v.startsWith('g:')?v.slice(2):st.cls?gradeOf(st.cls):null; st.sel=null; render();});
document.getElementById('subjSel').addEventListener('change',e=>{st.subj.clear();if(e.target.value)st.subj.add(e.target.value);st.sel=null;render();});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render()});
document.getElementById('future').addEventListener('change',e=>{st.future=e.target.checked;render()});

/* ---------- טעינה ---------- */
async function start(){
  let rows=EMBEDDED, source='נתונים מהקובץ שהועלה';
  for(const url of SHEET_URLS){
    try{
      const res=await fetch(url+'&t='+Date.now());
      if(!res.ok) throw new Error(res.status);
      const live=parseCSV(await res.text());
      if(parseRows(live).length){rows=live;source='מתעדכן מהגיליון · נטען ב־'+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});break;}
    }catch(e){}
  }
  if(rows===EMBEDDED) source='לא ניתן היה לטעון את הגיליון. מוצגים הנתונים השמורים';
  build(parseRows(rows));
  document.getElementById('src').textContent=source;
  try{const h=new URLSearchParams(location.hash.slice(1));let g=h.get('g'),c=h.get('c');
    if(!g&&!c){const s=JSON.parse(localStorage.getItem('exam-filter')||'{}');g=s.g;c=s.c;}
    if(c&&ALLCLS.includes(c)){st.cls=c;st.grade=gradeOf(c);} else if(g&&GRADES.includes(g)) st.grade=g;
    if(h.get('s')) h.get('s').split(',').filter(s=>ALLSUBJ.includes(s)).slice(0,1).forEach(s=>st.subj.add(s));
    if(h.get('v')==='cal') st.view='cal';
  }catch(e){}
  render();
}
start();
</script>
